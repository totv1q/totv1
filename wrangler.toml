name = "totv-cms-worker"
main = "worker.js"
compatibility_date = "2024-01-01"

# ── KV Namespace ────────────────────────────────────────────────
# أنشئ KV namespace في Cloudflare Dashboard:
# Workers & Pages → KV → Create namespace → "totv_cms_kv"
# ثم انسخ الـ ID هنا
[[kv_namespaces]]
binding = "KV"
id      = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ── Environment Variables ───────────────────────────────────────
# يُفضَّل تعيينها من Cloudflare Dashboard (أكثر أماناً)
# Workers & Pages → your_worker → Settings → Variables
[vars]
ADMIN_TOKEN    = "totv_admin_2024"   # ← غيّر هذا!
FCM_SERVER_KEY = ""                  # Firebase Server Key
ENCRYPT_KEY    = "totv_encrypt_2024" # مفتاح التشفير

# ── Routes (اختياري) ────────────────────────────────────────────
# إذا أردت ربط دومين خاص:
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# ── Build ────────────────────────────────────────────────────────
# لا يحتاج build — JavaScript خالص

# ── Observability ───────────────────────────────────────────────
[observability]
enabled = true
