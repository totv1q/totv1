workflows:

  # ══════════════════════════════════════════════
  #  Android — AAB + APK Release
  # ══════════════════════════════════════════════
  android-release:
    name: TOTV+ Android Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
      java: 17
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    scripts:
      - name: Set local.properties
        script: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "flutter.versionName=12.0.0" >> android/local.properties
          echo "flutter.versionCode=120" >> android/local.properties

      - name: Get packages
        script: flutter pub get

      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --no-tree-shake-icons

      - name: Build APK
        script: |
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --split-per-abi

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/apk/release/*.apk

  # ══════════════════════════════════════════════
  #  Web — Firebase Hosting
  # ══════════════════════════════════════════════
  web-release:
    name: TOTV+ Web Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.27.4
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Build Web
        script: |
          flutter build web \
            --release \
            --base-href / \
            --no-tree-shake-icons

      - name: Copy web configs
        script: |
          cp web/_headers  build/web/_headers  2>/dev/null || true
          cp web/_redirects build/web/_redirects 2>/dev/null || true

    artifacts:
      - build/web/**

  # ══════════════════════════════════════════════
  #  Windows — EXE Release
  # ══════════════════════════════════════════════
  windows-release:
    name: TOTV+ Windows Release
    max_build_duration: 90
    instance_type: windows_x2
    environment:
      flutter: 3.27.4
    cache:
      cache_paths:
        - ~/.pub-cache
    scripts:
      - name: Get packages
        script: flutter pub get

      - name: Build Windows
        script: |
          flutter build windows \
            --release \
            --no-tree-shake-icons

      - name: Create ZIP
        script: |
          cd build/windows/x64/runner/Release
          7z a -tzip ../../../../../totv_plus_windows.zip .

    artifacts:
      - totv_plus_windows.zip
