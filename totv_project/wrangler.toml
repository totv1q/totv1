# TOTV+ Gateway Worker v6.0
name               = "totv-proxy"
main               = "worker.js"
compatibility_date = "2024-09-23"
workers_dev        = true

# ES Modules format (default for modern workers)
# لا تضف هذا السطر — Wrangler يكتشف ES modules تلقائياً من export default

[[kv_namespaces]]
binding = "CACHE_KV"
id      = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[triggers]
crons = ["*/5 * * * *"]

